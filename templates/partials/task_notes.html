<!-- Task Notes Partial -->
<div class="fade-in">
    <!-- Add Note Form -->
    <form
        hx-post="/tasks/{{ task_id }}/notes"
        hx-target="#notes-section"
        hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful) this.reset()"
        class="flex gap-2 mb-3"
    >
        <input
            type="text" name="content" required maxlength="500"
            placeholder="Add a note..."
            class="flex-1 border border-walmart-gray-50 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-walmart-blue-100 focus:border-transparent"
        />
        <button
            type="submit"
            class="px-3 py-1.5 bg-walmart-blue-100 text-white text-sm font-semibold rounded-lg hover:bg-walmart-blue-110 transition-colors focus:outline-none focus:ring-2 focus:ring-walmart-blue-100 focus:ring-offset-2"
        >Add</button>
    </form>

    <!-- Notes List -->
    {% if notes %}
    <div class="space-y-2 max-h-48 overflow-y-auto">
        {% for note in notes %}
        <div class="bg-walmart-gray-10 rounded-lg p-2.5 group relative">
            <p class="text-sm text-walmart-gray-160 break-words pr-6">{{ note.content }}</p>
            <div class="flex justify-between items-center mt-1">
                <span class="text-[10px] text-walmart-gray-100">🗓️ {{ note.created_at }}</span>
                <button
                    hx-delete="/notes/{{ note.id }}?task_id={{ task_id }}"
                    hx-target="#notes-section"
                    hx-swap="innerHTML"
                    hx-confirm="Delete this note?"
                    class="opacity-0 group-hover:opacity-100 text-walmart-red-100 hover:text-red-700 transition-all focus:outline-none focus:ring-2 focus:ring-walmart-red-100 rounded focus:opacity-100"
                    aria-label="Delete note"
                >
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="text-center py-3">
        <div class="text-xs text-walmart-gray-100 italic">No notes yet. Add one above!</div>
    </div>
    {% endif %}
</div>
